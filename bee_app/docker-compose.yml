version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: bee_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: 'beekeeping_db'
      MYSQL_ROOT_PASSWORD: 'admin_password'
    ports:
      # Зовнішній порт 3308 : Внутрішній порт 3306
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: bee_web_app
    ports:
      - "5000:5000"
    environment:
      # Всередині Docker мережі звертаємось до 'db:3306'
      DATABASE_URL: "mysql+pymysql://root:admin_password@db:3306/beekeeping_db"
    depends_on:
      - db

volumes:
  db_data: