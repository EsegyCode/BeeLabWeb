version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: beelab_db
    restart: always
    environment:
      MYSQL_DATABASE: beekeeping_db
      MYSQL_ROOT_PASSWORD: root_password_тут
      MYSQL_USER: mykola_user
      MYSQL_PASSWORD: user_password_тут
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: beelab_app
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  db_data: