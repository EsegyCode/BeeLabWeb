{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">🐝 Реєстрація пасічника</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Ваше ім'я</label>
                        <input type="text" name="name" class="form-control" placeholder="Микола Кривцов" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 py-2 fw-bold">Створити акаунт</button>
                </form>
                <div class="text-center mt-3">
                    <small>Вже є акаунт? <a href="/login">Увійти</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
