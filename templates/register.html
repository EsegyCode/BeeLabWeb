{% extends 'base.html' %}

{% block title %}Реєстрація — BeeLab{% endblock %}

{% block content %}
<section class="auth-shell py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-6 col-xl-5">
            <div class="card auth-card border-0">
                <div class="card-body p-4 p-lg-5">
                    <div class="text-center mb-4">
                        <h1 class="h3 fw-bold mb-1">Створити акаунт</h1>
                        <p class="text-muted small mb-0">Розпочни облік пасіки за 2 хвилини.</p>
                    </div>
                    <form method="POST" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="username">Логін</label>
                            <input id="username" type="text" name="username" class="form-control" placeholder="Mykola_K" autocomplete="username" required autofocus>
                            <div class="form-text">Латиниця, цифри, крапка, дефіс, підкреслення; мінімум 3 символи.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="contact">Контактні дані</label>
                            <input id="contact" type="text" name="contact" class="form-control" placeholder="Телефон або @Telegram" autocomplete="tel">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold" for="password">Пароль</label>
                            <div class="input-group">
                                <input id="password" type="password" name="password" class="form-control" placeholder="Мінімум 6 символів" autocomplete="new-password" required>
                                <button class="btn btn-outline-secondary" type="button" data-password-toggle="#password" aria-pressed="false">Показати</button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-orange w-100 btn-lg">Створити акаунт</button>
                    </form>
                    <div class="text-center mt-4">
                        <small class="text-muted">Вже є акаунт? <a href="{{ url_for('auth.login') }}" class="fw-semibold text-decoration-none">Увійти</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block page_js %}
<script defer src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
