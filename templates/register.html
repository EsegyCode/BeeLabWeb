{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">🐝 Реєстрація пасічника</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Логін</label>
                        <input type="text" name="username" class="form-control" placeholder="Наприклад: Mykola_K" required>
                        <div class="form-text">Використовуйте цей логін для входу в систему.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Контактні дані</label>
                        <input type="text" name="contact" class="form-control" placeholder="Телефон або @Telegram">
                        <div class="form-text">Для відновлення доступу адміністратором.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Пароль</label>
                        <input type="password" name="password" class="form-control" placeholder="Мінімум 6 символів" required>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 py-2 fw-bold shadow-sm">Створити акаунт</button>
                </form>

                <div class="text-center mt-3">
                    <small class="text-muted">Вже є акаунт? <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-bold text-warning">Увійти</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
