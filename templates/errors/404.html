{% from "macros/icons.html" import icon %}
{% extends 'base.html' %}

{% block title %}Сторінку не знайдено — BeeLab{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="empty-state">
        <div class="empty-state-icon">{{ icon('search') }}</div>
        <h1 class="h2 fw-bold mb-2">404 — Сторінку не знайдено</h1>
        <p class="text-muted mb-4">Можливо, посилання застаріло або сторінка переміщена.</p>
        <a href="{{ url_for('hives.index') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-orange">На головну</a>
    </div>
</div>
{% endblock %}
