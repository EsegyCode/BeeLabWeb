{% from "macros/icons.html" import icon %}
{% extends 'base.html' %}

{% block title %}Доступ заборонено — BeeLab{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="empty-state">
        <div class="empty-state-icon">{{ icon('shield-lock') }}</div>
        <h1 class="h2 fw-bold mb-2">403 — Доступ заборонено</h1>
        <p class="text-muted mb-4">У вас немає прав для перегляду цієї сторінки.</p>
        <a href="{{ url_for('hives.index') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-orange">На головну</a>
    </div>
</div>
{% endblock %}
