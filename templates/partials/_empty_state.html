<div class="empty-state" role="status">
    <div class="empty-state-icon"><i class="bi {{ icon|default('bi-inbox') }}" aria-hidden="true"></i></div>
    <div class="fw-semibold mb-2">{{ title|default('Даних ще немає') }}</div>
    {% if text %}<p class="small text-muted mb-3">{{ text }}</p>{% endif %}
    {% if action_url %}<a href="{{ action_url }}" class="btn btn-outline-secondary btn-sm">{{ action_text|default('Додати') }}</a>{% endif %}
</div>
