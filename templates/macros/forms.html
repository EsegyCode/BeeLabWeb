{% macro password_field(id, name, label, placeholder="") %}
<div class="mb-3">
    {{ form_label(id, label, true) }}
    <div class="input-group input-group-lg">
        <input id="{{ id }}" type="password" name="{{ name }}" class="form-control" placeholder="{{ placeholder }}" autocomplete="current-password" required>
        <button class="btn btn-outline-secondary" type="button" data-password-toggle="#{{ id }}" aria-pressed="false" aria-label="Показати пароль">Показати</button>
    </div>
</div>
{% endmacro %}
