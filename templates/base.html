<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeLab Management — Цифрова пасіка</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bee-yellow: #ffc107;
            --bee-dark: #1e1e1e;
            --bee-light: #f4f7f6;
            --bee-accent: #e5ac00;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bee-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: #333;
        }

        .navbar {
            background-color: var(--bee-dark) !important;
            border-bottom: 3px solid var(--bee-yellow);
            padding: 0.8rem 0;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--bee-yellow) !important;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .main-container {
            flex: 1;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark shadow mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('hives.index') }}">
                <i class="fas fa-bee me-2"></i>BeeLab
            </a>
            <div class="navbar-nav ms-auto d-flex flex-row gap-3">
                <a class="nav-link text-white" href="{{ url_for('hives.calendar') }}">
                    <i class="fas fa-calendar-alt me-1 text-warning"></i> Календар робіт
                </a>
                <a class="nav-link text-white" href="{{ url_for('hives.instructions') }}">
                    <i class="fas fa-book me-1 text-warning"></i> Інструкція з імпорту
                </a>
            </div>
        </div>
    </nav>

    <div class="container main-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <footer class="py-4 mt-5">
        <div class="container">
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
