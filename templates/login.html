{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">🔑 Вхід у BeeLab</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Логін</label>
                        <input type="text" name="username" class="form-control" placeholder="Наприклад: Mykola_K" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Пароль</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 py-2 fw-bold shadow-sm">Увійти</button>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
</form>
                <div class="text-center mt-3">
                    <small class="text-muted">Немає акаунту? <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-bold text-warning">Зареєструватися</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
